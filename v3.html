<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Směny — koncept v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0C12;
    --night-1:#171F3D;
    --night-2:#2C3A72;
    --night-3:#4C5FA6;
    --night-glow:#8FA8FF;
    --day-1:#F2A93E;
    --day-2:#FFCD73;
    --day-ink:#5A3A0A;
    --paper:#EDEAE2;
    --paper-dim:rgba(237,234,226,.58);
    --paper-faint:rgba(237,234,226,.32);
    --card-r:26px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 700px at 18% -10%, #1a2140 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #241607 0%, transparent 55%),
      var(--ink);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:48px 20px; color:var(--paper); overflow-x:hidden;
  }
  .stage-label{
    position:fixed; top:22px; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--paper-faint); display:flex; gap:10px; align-items:center;
  }
  .stage-label .dot{width:6px;height:6px;border-radius:50%;background:var(--night-glow);box-shadow:0 0 10px var(--night-glow);}

  .phone{
    position:relative; width:380px; height:794px; border-radius:54px; padding:12px;
    background:linear-gradient(160deg,#1b1e28,#0c0d12 65%);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05) inset, 0 1px 0 rgba(255,255,255,.08) inset;
  }
  .screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--night-1);isolation:isolate;}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:104px;height:26px;background:#05060a;border-radius:16px;z-index:40;}

  .ombre-base{position:absolute;inset:0;background:linear-gradient(180deg,var(--night-1),var(--night-2) 60%,var(--night-1));z-index:0;}
  .ombre-day{position:absolute;inset:0;background:linear-gradient(180deg,var(--day-1),var(--day-2) 55%,var(--day-1));z-index:0;opacity:0;transition:opacity .18s linear;}
  .grain{position:absolute;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);background-size:3px 3px;opacity:.4;}

  .app-header{position:relative;z-index:20;padding:52px 22px 10px;display:flex;align-items:flex-start;justify-content:space-between;}
  .app-header .title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;letter-spacing:-.01em;}
  .app-header .sub{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--paper-dim);}
  .icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);}
  .icon-btn svg{width:15px;height:15px;stroke:var(--paper);}

  .timeline-wrap{position:relative;height:calc(100% - 90px);z-index:10;}
  .timeline{
    height:100%; overflow-y:scroll; scroll-snap-type:y mandatory;
    padding:6px 78px 6px 22px; scrollbar-width:none;
  }
  .timeline::-webkit-scrollbar{display:none;}

  .month-label{
    scroll-snap-align:start;
    padding:14px 4px 8px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--paper-faint);
  }

  .card{
    scroll-snap-align:center;
    border-radius:var(--card-r);
    margin:7px 0;
    position:relative;
    overflow:hidden;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.55);
    cursor:pointer;
    will-change:transform,opacity;
  }
  .card.today{box-shadow:0 22px 50px -16px rgba(0,0,0,.6), 0 0 0 1.5px rgba(237,234,226,.5);}
  .card.open{box-shadow:0 26px 56px -14px rgba(0,0,0,.65), 0 0 0 1.5px rgba(237,234,226,.65);}

  .card.night{background:linear-gradient(155deg,#232D57 0%, #171E3B 70%); color:var(--paper);}
  .card.night::before{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%, var(--night-3), transparent 70%);opacity:.55;}
  .card.day{background:linear-gradient(155deg,#FFDE9E 0%, #F4AD48 75%); color:var(--day-ink);}
  .card.day::before{content:"";position:absolute;right:-26px;top:-26px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fff5d9, transparent 70%);opacity:.85;}

  .card-main{padding:22px 22px 18px;position:relative;z-index:2;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .card-date{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;}
  .badge-today{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.16);}
  .card.day .badge-today{background:rgba(90,58,10,.14);}

  .card-kind{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:23px;margin-top:10px;letter-spacing:-.01em;}
  .card-time{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:14px;display:flex;align-items:center;gap:9px;}
  .card-time .code{font-weight:600;padding:2px 8px;border-radius:7px;background:rgba(255,255,255,.14);font-size:12px;}
  .card.day .card-time .code{background:rgba(90,58,10,.12);}

  .card-foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;}
  .roster-preview{display:flex;align-items:center;gap:10px;}
  .avatars{display:flex;}
  .avatars .av{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:9.5px;font-weight:600;background:rgba(255,255,255,.22);margin-left:-8px;border:2px solid rgba(0,0,0,.15);}
  .card.day .avatars .av{border-color:rgba(255,255,255,.35);background:rgba(90,58,10,.16);color:var(--day-ink);}
  .avatars .av:first-child{margin-left:0;}
  .count-txt{font-size:11.5px;font-family:'Inter',sans-serif;opacity:.85;}

  .chevron{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);transition:transform .3s ease;flex:none;}
  .card.day .chevron{background:rgba(90,58,10,.12);}
  .chevron svg{width:11px;height:11px;}
  .card.open .chevron{transform:rotate(180deg);}

  .roster{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1);position:relative;z-index:2;}
  .card.open .roster{max-height:340px;}
  .roster-inner{padding:2px 22px 20px;border-top:1px solid rgba(255,255,255,.14);margin:0 22px;}
  .card.day .roster-inner{border-top-color:rgba(90,58,10,.18);}
  .roster-inner .roster-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin:12px 0 8px;}
  .officer{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .officer .av{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.16);}
  .card.day .officer .av{background:rgba(90,58,10,.14);}
  .officer .name{font-size:13px;font-weight:500;}
  .officer .rank{font-size:10px;opacity:.6;margin-left:auto;font-family:'JetBrains Mono',monospace;}

  /* ---- scrollable right rail ---- */
  .rail{
    position:absolute; top:86px; bottom:0; right:10px; width:60px; z-index:30;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 14%, #000 86%, transparent 100%);
            mask-image:linear-gradient(180deg, transparent 0, #000 14%, #000 86%, transparent 100%);
  }
  .rail-line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(237,234,226,.18);transform:translateX(-50%);}
  .rail-scroll{
    height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(50% - 20px) 0;
  }
  .rail-scroll::-webkit-scrollbar{display:none;}
  .rail-day{
    scroll-snap-align:center;
    position:relative; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:11px 0; cursor:pointer; -webkit-tap-highlight-color:transparent;
    width:60px;
  }
  .rail-dot{width:6px;height:6px;border-radius:50%;background:rgba(237,234,226,.32);transition:all .25s ease;}
  .rail-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--paper-faint);letter-spacing:.03em;transition:all .25s ease;}
  .rail-day.active .rail-dot{width:10px;height:10px;background:var(--paper);box-shadow:0 0 14px rgba(237,234,226,.7);}
  .rail-day.active .rail-lbl{color:var(--paper);font-weight:600;font-size:10.5px;}
  .rail-day.today .rail-lbl::after{content:"";display:block;width:3px;height:3px;border-radius:50%;background:var(--day-1);margin:3px auto 0;}

  .home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;background:rgba(237,234,226,.5);z-index:40;}

  .footnote{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--paper-faint);letter-spacing:.05em;max-width:380px;}
</style>
</head>

      <div class="home-ind"></div>

  </div>

;
const TODAY = 19;
const MONTH_LABEL = "Srpen 2026";

const timeline = document.getElementById('timeline');
const railScroll = document.getElementById('railScroll');
const ombreDay = document.getElementById('ombreDay');

function codeLabel(c){ return c; }

function buildCard(dayObj, kind){
  const isDay = kind === 'day';
  const list = isDay ? dayObj.day_shift : dayObj.night_shift;
  const time = isDay ? '07:00 – 19:00' : '19:00 – 07:00';
  const kindLabel = isDay ? 'Denní služba' : 'Noční služba';
  const isToday = dayObj.day === TODAY;
  const stroke = isDay ? '#5A3A0A' : '#EDEAE2';

  const wrap = document.createElement('div');
  wrap.className = `card ${kind}${isToday ? ' today':''}`;
  wrap.dataset.day = dayObj.day;
  wrap.dataset.kind = kind;

  const avatars = list.slice(0,4).map(o=>`<div class="av">${o.ini}</div>`).join('');
  const countTxt = list.length ? `${list.length} strážníci` : 'nikdo ve službě';

  const glyphSvg = isDay
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>`;

  const officers = list.map(o=>`
    <div class="officer">
      <div class="av">${o.ini}</div>
      <div class="name">${o.name}</div>
      <div class="rank">${o.code}</div>
    </div>`).join('') || `<div class="officer"><div class="name" style="opacity:.6">Nikdo nemá tento den ${isDay?'denní':'noční'} službu.</div></div>`;

  wrap.innerHTML = `
    <div class="card-main">
      <div class="card-top">
        <div class="card-date">${dayObj.wd} · ${dayObj.day}. 8. 2026</div>
        ${isToday ? '<div class="badge-today">DNES</div>' : ''}
      </div>
      <div class="card-kind">${kindLabel}</div>
      <div class="card-time"><span class="code">${isDay?'D12':'N12'}</span> ${time}</div>
      <div class="card-foot">
        <div class="roster-preview">
          <div class="avatars">${avatars}</div>
          <div class="count-txt">${countTxt}</div>
        </div>
        <div class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>
    <div class="roster">
      <div class="roster-inner">
        <div class="roster-title">Ve službě · ${isDay?'denní':'noční'}</div>
        ${officers}
      </div>
    </div>
  `;

  wrap.querySelector('.card-main').addEventListener('click', ()=> wrap.classList.toggle('open'));
  return wrap;
}

// build timeline
const monthLbl = document.createElement('div');
monthLbl.className = 'month-label';
monthLbl.textContent = MONTH_LABEL;
timeline.appendChild(monthLbl);

DAYS.forEach(d=>{
  timeline.appendChild(buildCard(d,'day'));
  timeline.appendChild(buildCard(d,'night'));
});

// build rail
DAYS.forEach(d=>{
  const el = document.createElement('div');
  el.className = 'rail-day' + (d.day===TODAY ? ' today' : '');
  el.dataset.day = d.day;
  el.innerHTML = `<div class="rail-dot"></div><div class="rail-lbl">${d.wd} ${d.day}</div>`;
  el.addEventListener('click', ()=> scrollMainToDay(d.day, true));
  railScroll.appendChild(el);
});

const cardEls = Array.from(timeline.querySelectorAll('.card'));
const railEls = Array.from(railScroll.querySelectorAll('.rail-day'));

let guardMain = false, guardRail = false, guardTimer = null;
function setGuard(flag){
  flag(true);
  clearTimeout(guardTimer);
  guardTimer = setTimeout(()=>flag(false), 420);
}

function setActiveDay(day){
  railEls.forEach(el=> el.classList.toggle('active', +el.dataset.day === day));
}

function scrollMainToDay(day, smooth){
  const el = cardEls.find(c=> +c.dataset.day===day && c.dataset.kind==='day');
  if(!el) return;
  guardMain = true;
  el.scrollIntoView({behavior: smooth?'smooth':'auto', block:'center'});
  setActiveDay(day);
  clearTimeout(guardTimer);
  guardTimer = setTimeout(()=> guardMain=false, 450);
}

function scrollRailToDay(day, smooth){
  const el = railEls.find(r=> +r.dataset.day===day);
  if(!el) return;
  guardRail = true;
  el.scrollIntoView({behavior: smooth?'smooth':'auto', block:'center', inline:'nearest'});
  clearTimeout(guardTimer);
  guardTimer = setTimeout(()=> guardRail=false, 450);
}

function centerMostCard(){
  const rect = timeline.getBoundingClientRect();
  const cy = rect.top + rect.height/2;
  let best = null, bestDist = Infinity;
  cardEls.forEach(c=>{
    const r = c.getBoundingClientRect();
    const cc = r.top + r.height/2;
    const dist = Math.abs(cc - cy);
    if(dist < bestDist){ bestDist = dist; best = c; }
  });
  return best;
}

function applyFocusStyles(){
  const rect = timeline.getBoundingClientRect();
  const cy = rect.top + rect.height/2;
  let dayWeight = 0, totalWeight = 0;
  cardEls.forEach(c=>{
    const r = c.getBoundingClientRect();
    const cc = r.top + r.height/2;
    const dist = Math.abs(cc - cy);
    const norm = Math.min(1, dist / (rect.height*0.62));
    const focus = 1 - norm;
    const scale = 0.88 + focus*0.12;
    const opacity = 0.32 + focus*0.68;
    c.style.transform = `scale(${scale})`;
    c.style.opacity = opacity;
    const w = Math.max(0, focus);
    totalWeight += w;
    if(c.dataset.kind === 'day') dayWeight += w;
  });
  const dayness = totalWeight ? dayWeight/totalWeight : 0.5;
  ombreDay.style.opacity = dayness.toFixed(3);
}

let rafPending = false;
function onMainScroll(){
  if(!rafPending){
    rafPending = true;
    requestAnimationFrame(()=>{
      applyFocusStyles();
      if(!guardMain){
        const c = centerMostCard();
        if(c){
          const day = +c.dataset.day;
          setActiveDay(day);
          if(!guardRail) scrollRailToDay(day, true);
        }
      }
      rafPending = false;
    });
  }
}

let railRaf = false;
function onRailScroll(){
  if(guardRail) return;
  if(!railRaf){
    railRaf = true;
    requestAnimationFrame(()=>{
      const rect = railScroll.getBoundingClientRect();
      const cy = rect.top + rect.height/2;
      let best=null, bestDist=Infinity;
      railEls.forEach(el=>{
        const r = el.getBoundingClientRect();
        const cc = r.top + r.height/2;
        const dist = Math.abs(cc-cy);
        if(dist<bestDist){bestDist=dist;best=el;}
      });
      if(best){
        const day = +best.dataset.day;
        setActiveDay(day);
        if(!guardMain) scrollMainToDay(day, true);
      }
      railRaf = false;
    });
  }
}

timeline.addEventListener('scroll', onMainScroll);
railScroll.addEventListener('scroll', onRailScroll);

// init: center on today
requestAnimationFrame(()=>{
  scrollMainToDay(TODAY, false);
  scrollRailToDay(TODAY, false);
  setTimeout(applyFocusStyles, 50);
});
</script>
